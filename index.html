<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المكتبة الإلكترونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    header {
      background: linear-gradient(90deg, #00bfa5, #1de9b6);
      color: white;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      background-color: #e0f2f1;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex-wrap: wrap;
    }
    nav a, nav button {
      text-decoration: none;
      color: #00796b;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    nav a:hover, nav button:hover {
      background-color: #b2dfdb;
    }
    .search-bar {
      text-align: center;
      margin: 2rem;
    }
    .search-bar input {
      width: 60%;
      padding: 0.7rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .container {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }
    .book {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1rem;
      transition: transform 0.3s ease;
      text-align: center;
    }
    .book:hover {
      transform: translateY(-5px);
    }
    .book img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    .book h3 {
      margin: 1rem 0 0.5rem;
      color: #004d40;
    }
    .book p {
      color: #666;
      font-size: 0.95rem;
    }
    .book a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #00bfa5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .book a:hover {
      background-color: #009688;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      background: #e0f2f1;
      font-size: 0.9rem;
      color: #555;
    }
    /* نافذة نموذج الإضافة (Modal) */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
      padding-top: 50px;
      box-sizing: border-box;
    }
    .modal-content {
      background: white;
      margin: auto;
      border-radius: 12px;
      padding: 20px 30px;
      max-width: 600px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
    }
    .close-btn {
      color: #aaa;
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
    }
    .close-btn:hover {
      color: #000;
    }
    .add-book-form h2 {
      margin-top: 0;
      color: #00796b;
      text-align: center;
    }
    .add-book-form label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
      color: #004d40;
    }
    .add-book-form input[type="text"],
    .add-book-form textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
    }
    .add-book-form textarea {
      resize: vertical;
      height: 80px;
    }
    .add-book-form button {
      margin-top: 1.5rem;
      background-color: #00bfa5;
      border: none;
      color: white;
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }
    .add-book-form button:hover {
      background-color: #009688;
    }
  </style>
</head>
<body>
  <header>
    <h1>المكتبة الإلكترونية للكلية</h1>
  </header>
  <nav>
    <a href="#">الرئيسية</a>
    <a href="#">كتب</a>
    <a href="#">مشاريع التخرج</a>
    <a href="#">بحوث</a>
    <a href="#">اتصل بنا</a>
    <button id="openAddBookBtn" title="إضافة كتاب جديد">إضافة كتاب</button>
  </nav>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب...">
  </div>

  <div class="container" id="bookContainer">
    <!-- الكتب ستُضاف هنا تلقائياً -->
  </div>

  <footer>
    &copy; 2025 المكتبة الإلكترونية للكلية - جميع الحقوق محفوظة
  </footer>

  <!-- نموذج إضافة كتاب داخل نافذة منبثقة (Modal) -->
  <div id="addBookModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <form class="add-book-form" id="addBookForm" onsubmit="return false;">
        <h2>إضافة كتاب جديد</h2>
        <label for="titleInput">اسم الكتاب</label>
        <input type="text" id="titleInput" placeholder="ادخل اسم الكتاب" required>

        <label for="descInput">وصف الكتاب</label>
        <textarea id="descInput" placeholder="ادخل وصفًا موجزًا للكتاب" required></textarea>

        <label for="imgInput">رابط صورة الغلاف</label>
        <input type="text" id="imgInput" placeholder="https://example.com/image.jpg" required>

        <label for="linkInput">رابط التحميل</label>
        <input type="text" id="linkInput" placeholder="https://example.com/file.pdf" required>

        <button id="addBookBtn">إضافة الكتاب</button>
      </form>
    </div>
  </div>

  <script>
    let books = [
      {
        title: "مبادئ البرمجة",
        desc: "كتاب يشرح أساسيات البرمجة بلغة بايثون.",
        img: "https://via.placeholder.com/250x200?text=مبادئ+البرمجة",
        link: "#"
      },
      {
        title: "هياكل البيانات",
        desc: "شرح تفصيلي لهياكل البيانات والخوارزميات.",
        img: "https://via.placeholder.com/250x200?text=هياكل+البيانات",
        link: "#"
      },
      {
        title: "مشروع التخرج - نظام إدارة",
        desc: "مشروع تخرج شامل لتصميم نظام إدارة بيانات.",
        img: "https://via.placeholder.com/250x200?text=مشروع+تخرج",
        link: "#"
      },
      {
        title: "بحث حول الذكاء الاصطناعي",
        desc: "دراسة أكاديمية حول تقنيات الذكاء الاصطناعي.",
        img: "https://via.placeholder.com/250x200?text=الذكاء+الاصطناعي",
        link: "#"
      },
      {
        title: "دراسات عليا",
        desc: "عليا.",
        img: "https://scontent.fnjf1-3.fna.fbcdn.net/v/t39.30808-1/516951879_122217489890132941_5113825375544856091_n.jpg",
        link: "#"
      }
    ];

    function renderBooks(filteredBooks) {
      const container = document.getElementById('bookContainer');
      container.innerHTML = '';
      filteredBooks.forEach(book => {
        container.innerHTML += `
          <div class="book">
            <img src="${book.img}" alt="${book.title}" />
            <h3>${book.title}</h3>
            <p>${book.desc}</p>
            <a href="${book.link}" target="_blank" rel="noopener">تحميل</a>
          </div>
        `;
      });
    }

    // البحث
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const filtered = books.filter(book => book.title.toLowerCase().includes(query));
      renderBooks(filtered);
    });

    // فتح وإغلاق النافذة المنبثقة للنموذج
    const modal = document.getElementById('addBookModal');
    const openBtn = document.getElementById('openAddBookBtn');
    const closeBtn = document.getElementById('closeModalBtn');

    openBtn.onclick = () => {
      modal.style.display = 'block';
    };

    closeBtn.onclick = () => {
      modal.style.display = 'none';
    };

    window.onclick = event => {
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    };

    // إضافة كتاب مع التحقق من كلمة المرور
    document.getElementById('addBookForm').addEventListener('submit', () => {
      const password = prompt('يرجى إدخال كلمة المرور لإضافة كتاب جديد:');
      const correctPassword = '12345'; // غيّرها لكلمة مرورك الخاصة

      if (password !== correctPassword) {
        alert('كلمة المرور غير صحيحة! لا يمكنك إضافة الكتاب.');
        return;
      }

      const title = document.getElementById('titleInput').value.trim();
      const desc = document.getElementById('descInput').value.trim();
      const img = document.getElementById('imgInput').value.trim();
      const link = document.getElementById('linkInput').value.trim();

      if (!title || !desc || !img || !link) {
        alert('يرجى ملء جميع الحقول!');
        return;
      }

      books.push({ title, desc, img, link });
      renderBooks(books);

      // إعادة تعيين الحقول وإغلاق النافذة
      document.getElementById('addBookForm').reset();
      modal.style.display = 'none';
    });

    // عرض جميع الكتب عند بداية التشغيل
    renderBooks(books);
  </script>
</body>
</html>
