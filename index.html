<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المكتبة الإلكترونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    header {
      background: linear-gradient(90deg, #00897B, #004D40);
      color: white;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    nav {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      background-color: #e0f2f1;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex-wrap: wrap;
    }
    nav a, nav button {
      text-decoration: none;
      color: #00796b;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    nav a:hover, nav button:hover {
      background-color: #b2dfdb;
    }

    /* قائمة اتصل بنا المنبثقة */
    #contactPopup {
      display: none;
      position: absolute;
      top: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #e0f2f1;
      border: 2px solid #00897B;
      border-radius: 14px;
      padding: 1.5rem 2rem;
      width: 320px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      z-index: 1000;
      margin-top: 8px;
      font-size: 0.95rem;
      color: #004d40;
      text-align: center;
    }
    #contactPopup div {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      gap: 10px;
      direction: ltr;
    }
    #contactPopup div:last-child {
      margin-bottom: 0;
    }
    #contactPopup svg {
      width: 20px;
      height: 20px;
      fill: #00796b;
      flex-shrink: 0;
    }
    #contactNote {
      color: #26a69a;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
      direction: rtl;
    }

    .search-bar {
      text-align: center;
      margin: 2rem;
    }
    .search-bar input {
      width: 60%;
      max-width: 400px;
      padding: 0.7rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    /* تنسيق عرض الكتب كمربعات متوسطة */
    .container {
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.8rem;
      justify-items: center;
    }
    .book {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1rem;
      transition: transform 0.3s ease;
      text-align: center;
      width: 100%;
      max-width: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .book:hover {
      transform: translateY(-5px);
    }
    .book img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }
    .book h3 {
      margin: 1rem 0 0.5rem;
      color: #004d40;
      font-size: 1.2rem;
    }
    .book p {
      color: #666;
      font-size: 1rem;
      margin: 0 0 1rem 0;
    }
    .book a {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      background-color: #00897B;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .book a:hover {
      background-color: #004D40;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background: #e0f2f1;
      font-size: 0.9rem;
      color: #555;
    }
    footer a {
      color: #e1306c;
      text-decoration: none;
      font-size: 1.2rem;
      margin-right: 8px;
    }

    .dark-mode {
      background-color: #121212 !important;
      color: #e0e0e0 !important;
    }
    .dark-mode .book {
      background-color: #1e1e1e !important;
    }
    .dark-mode input,
    .dark-mode textarea {
      background-color: #2e2e2e !important;
      color: #e0e0e0 !important;
      border-color: #555 !important;
    }
    .dark-mode a {
      color: #80cbc4;
    }
    #darkModeBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      z-index: 999;
    }
  </style>
</head>
<body>
  <header>
    <h1>المكتبة الإلكترونية للكلية</h1>
  </header>
  <nav>
    <a href="#">الرئيسية</a>
    <a href="#" id="contactBtn" aria-haspopup="true" aria-expanded="false">اتصل بنا ▼</a>

    <div id="contactPopup" role="dialog" aria-modal="true" aria-labelledby="contactBtn">
      <div>
        <span>ali.razaq.hussein.md@gmail.com</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 2l-8 5-8-5V6l8 5 8-5v.01z"/></svg>
      </div>
      <div>
        <span>07804267805</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.62 10.79a15.466 15.466 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.21c1.21.48 2.53.75 3.88.75a1 1 0 011 1v3.5a1 1 0 01-1 1C10.07 21.5 2.5 13.93 2.5 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.35.27 2.67.75 3.88a1 1 0 01-.21 1.11l-2.2 2.2z"/></svg>
      </div>
      <div id="contactNote">لطلب أي كتاب أو مصدر غير موجود تواصل عبر المعلومات التالية لغرض توفيره</div>
    </div>
  </nav>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب...">
  </div>

  <div class="container" id="bookContainer"></div>

  <footer id="pageFooter">
    &copy; 2025 المكتبة الإلكترونية للكلية - جميع الحقوق محفوظة<br>
    developed by Eng Ali Al Waily
    <a href="https://instagram.com/1j_it" target="_blank" rel="noopener">📷</a>
  </footer>

  <button id="darkModeBtn">🌓 الوضع الداكن</button>

  <script>
    let books = JSON.parse(localStorage.getItem('books')) || [
      {
        title: "مبادئ البرمجة",
        desc: "كتاب يشرح أساسيات البرمجة بلغة بايثون.",
        img: "https://cdn.brandfetch.io/idfR5zZiYX/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1746096060114",
        link: "#"
      },
      {
        title: "هياكل البيانات",
        desc: "شرح تفصيلي لهياكل البيانات والخوارزميات.",
        img: "https://cdn.brandfetch.io/idfR5zZiYX/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1746096060114",
        link: "#"
      },
      {
        title: "مشروع التخرج - نظام إدارة",
        desc: "مشروع تخرج شامل لتصميم نظام إدارة بيانات.",
        img: "https://cdn.brandfetch.io/idfR5zZiYX/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX&t=1746096060114",
        link: "#"
      },
      {
        title: "بحث حول الذكاء الاصطناعي",
        desc: "دراسة أكاديمية حول تقنيات الذكاء الاصطناعي.",
        img: "https://via.placeholder.com/250x200?text=الذكاء+الاصطناعي",
        link: "#"
      }
    ];

    function renderBooks(filteredBooks) {
      const container = document.getElementById('bookContainer');
      container.innerHTML = '';
      filteredBooks.forEach(book => {
        container.innerHTML += `
          <div class="book">
            <img src="${book.img}" alt="${book.title}" />
            <h3>${book.title}</h3>
            <p>${book.desc}</p>
            <a href="${book.link}" target="_blank" rel="noopener">تحميل</a>
          </div>
        `;
      });
      localStorage.setItem('books', JSON.stringify(books));
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const filtered = books.filter(book => book.title.toLowerCase().includes(query));
      renderBooks(filtered);
    });

    document.getElementById('darkModeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('dark-mode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
    });

    if (localStorage.getItem('dark-mode') === 'enabled') {
      document.body.classList.add('dark-mode');
    }

    // التحكم بفتح وغلق نافذة "اتصل بنا"
    const contactBtn = document.getElementById('contactBtn');
    const contactPopup = document.getElementById('contactPopup');

    contactBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (contactPopup.style.display === 'block') {
        contactPopup.style.display = 'none';
        contactBtn.setAttribute('aria-expanded', 'false');
      } else {
        contactPopup.style.display = 'block';
        contactBtn.setAttribute('aria-expanded', 'true');
      }
    });

    document.addEventListener('click', (e) => {
      if (!contactPopup.contains(e.target) && !contactBtn.contains(e.target)) {
        contactPopup.style.display = 'none';
        contactBtn.setAttribute('aria-expanded', 'false');
      }
    });

    renderBooks(books);
  </script>
</body>
</html>
